name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust:
    name: Sidecar (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sidecar/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sidecar/Cargo.lock') }}
      - name: Format check
        working-directory: sidecar
        run: cargo fmt --check
      - name: Clippy
        working-directory: sidecar
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: sidecar
        run: cargo test

  python:
    name: Plugin (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain (build sidecar for E2E)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sidecar/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sidecar/Cargo.lock') }}
      - name: Build sidecar (debug, for E2E tests)
        working-directory: sidecar
        run: cargo build
      - name: Run plugin tests
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q
