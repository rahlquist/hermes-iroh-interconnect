name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Sidecar (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sidecar/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sidecar/Cargo.lock') }}
      - name: Format check
        working-directory: sidecar
        run: cargo fmt --check
      - name: Clippy
        working-directory: sidecar
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: sidecar
        run: cargo test

  python:
    name: Plugin (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sidecar/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sidecar/Cargo.lock') }}
      - name: Build sidecar
        working-directory: sidecar
        run: cargo build
      - name: Run plugin tests
        run: |
          python -m pip install pytest PyYAML
          # Integration tests require a live Hermes source checkout; all
          # standalone adapter, security, transfer, and sidecar tests run.
          python -m pytest tests/ -q \
            --ignore=tests/test_hermes_integration.py

  hermes-integration:
    name: Hermes PluginManager integration (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML
      - name: Fetch Hermes source checkout
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git ~/.hermes/hermes-agent
      - name: Run real PluginManager integration tests
        run: python -m pytest tests/test_hermes_integration.py -q
